name: fazan-trading-dev

services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres

  backend:
    extends:
      file: compose.yaml
      service: backend
    build:
      target: dev
    init: true
    environment:
      COOKIE_SECURE: "false"
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          initial_sync: true
        - action: sync+restart
          path: ./backend/migrations
          target: /app/migrations
        - action: sync+restart
          path: ./backend/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    extends:
      file: compose.yaml
      service: frontend
    build:
      target: dev
    init: true
    environment:
      BACKEND_PROXY_TARGET: http://backend:3000
    ports: !override
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5173}:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ./frontend/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile

volumes:
  postgres-data:
